# DrupalGym Pipeline Configuration
project_name: "DrupalGym"
version: "1.0.0"
seed: 42

directories:
  raw: "raw"
  clean: "clean"
  sft: "sft"
  quality: "quality"
  dataset: "dataset"
  eval: "eval"
  models: "models"
  manifests: "manifests"
  sources: "sources"

sources:
  rate_limit:
    delay_seconds: 0.1
    max_retries: 3
    max_requests_per_second: 2.0
  parallel:
    composer_workers: 4
  drupal_core:
    type: "git"
    url: "https://git.drupalcode.org/project/drupal.git"
    branch: "11.x"
    tags: ["sdc_core_examples"]
  drupal_projects:
    type: "api"
    endpoint: "https://www.drupal.org/api-d7/node.json"
    filters:
      core_compatibility: "^11"
    user_agent: "DrupalGym/1.0"
    max_pages: 10
    limit: 1000
    sort: "changed"
    direction: "desc"
  drupal_change_records:
    enabled: true
    type: "drupal_change_records"
    list_url: "https://www.drupal.org/list-changes/drupal"
    allowed_node_prefix: "https://www.drupal.org/node/"
    status: "published"
    target_versions: ["10.2.x", "10.3.x", "11.x"]
    lookback_months: 24
    max_list_pages: 80
    max_records: 1000
  discovery:
    max_pages: 20
    limit_per_page: 50
    min_last_changed_days: 365
    max_projects_after_filter: 200
  curated_repos:
    - id: "drupal_gin_theme"
      type: "git"
      url: "https://git.drupalcode.org/project/gin.git"
      ref: "2.x"
      description: "Gin admin theme (contrib) for component theming patterns."
      category: "contrib_theme"
    - id: "drupal_ui_patterns"
      type: "git"
      url: "https://git.drupalcode.org/project/ui_patterns.git"
      ref: "2.x"
      description: "UI Patterns module with component definitions."
      category: "contrib_sdc"
    - id: "drupal_ui_suite"
      type: "git"
      url: "https://git.drupalcode.org/project/ui_suite.git"
      ref: "2.x"
      description: "UI Suite module for component-driven theming."
      category: "contrib_sdc"
    - id: "drupal_storybook"
      type: "git"
      url: "https://git.drupalcode.org/project/storybook.git"
      ref: "1.x"
      description: "Storybook integration for Drupal component libraries."
      category: "contrib_sdc"
    - id: "drupal_component_library"
      type: "git"
      url: "https://git.drupalcode.org/project/component_library.git"
      ref: "1.x"
      description: "Component Library module."
      category: "contrib_sdc"
    - id: "drupal_sdc_examples"
      type: "git"
      url: "https://git.drupalcode.org/project/sdc_examples.git"
      ref: "1.x"
      description: "Single Directory Components examples module."
      category: "contrib_sdc"
    - id: "drupal_recommended_project"
      type: "git"
      url: "https://github.com/drupal/recommended-project.git"
      ref: "11.x"
      description: "Drupal recommended project starter kit."
      category: "starter_kit"
    - id: "drupal_composer_project"
      type: "git"
      url: "https://github.com/drupal-composer/drupal-project.git"
      ref: "11.x"
      description: "Drupal Composer project template starter kit."
      category: "starter_kit"
    - id: "real_world_site_placeholder"
      type: "git"
      url: "https://github.com/example/drupal11-site.git"
      ref: "main"
      description: "Placeholder real-world Drupal 11 site repo; replace with vetted targets."
      category: "real_world_site"
      enabled: false
  filters:
    require_drupal_core_constraint: "^11"
    require_php_constraint_min: "8.3"
    exclude_archived_or_security_only: true
    exclude_project_machine_names:
      - "mcp_tools"

acquisition:
  reuse_existing_repos: true
  reuse_existing_docs: true
  parallel:
    git_workers: 4
    docs_workers: 2
    change_record_workers: 4
  exclude_source_ids:
    - "mcp_tools"
  docs:
    request_timeout_seconds: 30
    request_delay_seconds: 0.25
    retry_backoff_seconds: 0.4
    max_retries: 2
    change_record_request_timeout_seconds: 30
    change_record_request_delay_seconds: 0.15
    change_record_listing_delay_seconds: 0.15
    max_pages_per_source: 300
    url_denylist_terms:
      - "drupal-8"
      - "drupal-9"
      - "/8.x/"
      - "/9.x/"
      - "annotation"
      - "%40block"
    allowed_prefixes:
      drupal_recipes:
        - "https://www.drupal.org/docs/extending-drupal/drupal-recipes"
      drupal_docs:
        - "https://www.drupal.org/docs"
        - "https://www.drupal.org/docs/develop"
        - "https://www.drupal.org/docs/develop/theming-drupal"
        - "https://www.drupal.org/docs/develop/theming-drupal/single-directory-components"
        - "https://www.drupal.org/docs/develop/theming"
      drupal_api:
        - "https://api.drupal.org/api/drupal"
      symfony_docs:
        - "https://symfony.com/doc/7.0/"
      drupal_security:
        - "https://www.drupal.org/security"
      drupal_change_records:
        - "https://www.drupal.org/list-changes/drupal"
        - "https://www.drupal.org/node/"

normalization:
  parallel:
    read_workers: 6
  dedup:
    exact_hash: true
    near_dup_enabled: true
    near_dup_method: "simhash_5gram"
    near_dup_threshold: 0.92

sft_generation:
  parallel:
    read_workers: 6
  enable_symbol_kind_prompts: true
  enable_sdc_bundle_generation: true
  sdc_bundle_variants: 4
  include_extensions: [".php", ".module", ".inc", ".install", ".theme", ".yml", ".twig", ".md"]
  exclude_source_prefixes:
    - "repos/mcp_tools/"
  doc_source_allowlist_prefixes:
    - "docs/www_drupal_org/"
    - "docs/www_drupal_org/docs/extending-drupal/drupal-recipes/"
    - "docs/www_drupal_org/docs/develop/theming/"
    - "docs/www_drupal_org/docs/develop/theming-drupal/"
    - "docs/www_drupal_org/docs/develop/theming-drupal/single-directory-components/"
    - "docs/api_drupal_org/"
    - "repos/drupal_core/"
  doc_topic_denylist_terms:
    - "mcp"
    - "apidog"
    - "gitlab duo"
    - "workflow automation"
    - "drupal 8"
    - "drupal 9"
    - "annotation"
    - "@block"
  doc_max_output_chars: 6000

quality:
  runtime_check_workers: 3
  run_php_lint: true
  run_phpcs: true
  run_phpstan: true
  phpstan_failure_mode: "syntax_only"
  min_output_chars: 220
  max_output_chars: 30000
  reject_path_leakage_tokens: true
  path_leakage_tokens: ["repos/"]
  enforce_modern_drupal_patterns: true
  modern_drupal_required_categories: ["attributes", "di"]
  modern_drupal_relevant_types: ["code_reference", "bugfix", "refactor", "write_from_spec", "explain_and_implement"]
  modern_drupal_relevant_source_patterns:
    - "/plugin/"
    - ".module"
    - ".install"
    - ".theme"
    - ".services.yml"
  modern_drupal_relevant_instruction_terms:
    - "plugin"
    - "module"
    - "block"
    - "service"
    - "dependency injection"
    - "constructor injection"
    - "containerinterface"
  weak_category_patterns:
    attributes:
      - "#\\[[A-Za-z_\\\\][A-Za-z0-9_\\\\]*"
    di:
      - "\\bContainerInterface\\b"
      - "public\\s+static\\s+function\\s+create\\s*\\("
      - "services\\.yml"
      - "logger\\.factory"
      - "__construct\\s*\\("
  min_output_chars_by_type:
    code_reference: 220
    yaml_reference: 10
    twig_reference: 120
    sdc_reference: 120
    doc_summary: 180
    refactor: 80
  max_output_chars_by_type:
    code_reference: 24000
    yaml_reference: 8000
    twig_reference: 12000
    sdc_reference: 12000
    doc_summary: 12000
    refactor: 24000
  max_numeric_line_streak: 12
  max_repeated_line_ratio: 0.31
  duplicate_output_mode: "normalized"
  reject_ambiguous_instruction_input: true
  max_outputs_per_instruction_input: 1
  require_non_empty_input_for_types:
    - "yaml_reference"
    - "twig_reference"
    - "sdc_reference"
  doc_source_allowlist_prefixes:
    - "docs/www_drupal_org/"
    - "docs/www_drupal_org/docs/extending-drupal/drupal-recipes/"
    - "docs/www_drupal_org/docs/develop/theming/"
    - "docs/www_drupal_org/docs/develop/theming-drupal/"
    - "docs/www_drupal_org/docs/develop/theming-drupal/single-directory-components/"
    - "docs/api_drupal_org/"
    - "repos/drupal_core/"
  doc_topic_denylist_terms:
    - "mcp"
    - "apidog"
    - "gitlab duo"
    - "workflow automation"
    - "drupal 8"
    - "drupal 9"
    - "annotation"
    - "@block"

dataset:
  training_version: "v2"
  targets:
    train: 0.8
    valid: 0.1
    test: 0.1
  max_seq_len: 1024

dataset_refinement:
  input_version: "v1"
  output_version: "v2"
  seed: 42
  max_output_lines: 300
  max_output_chars: 6000
  max_repeated_line_ratio: 0.31
  max_source_share: 0.90
  fenced_output_share_min: 0.35
  contract_instruction_share_min: 0.35
  retrieval_share_max: 0.60
  deduplicate_normalized_output: true
  duplicate_resolution: "prefer_augmented_drop_retrieval"
  format_alignment:
    enabled: true
    mix_retrieval_share: 0.60
    mix_instruction_share: 0.40
    drop_explain_topic_prompts: true
    allowed_languages: ["php", "yaml", "twig", "text"]
    fence_required_for_languages: ["php", "yaml", "twig"]
  require_context_for_types:
    - "yaml_reference"
    - "twig_reference"
    - "code_reference"
    - "sdc_reference"
  chunk_instruction_mode: "metadata_only"
  chunk_retrieval_mode: "head_only"
  char_chunk_retrieval_mode: "head_only"
  weak_category_targets:
    attributes: 600
    di: 600
    routing: 300
    sdc: 250
    twig: 450
  enforce_modern_drupal_patterns: true
  modern_drupal_required_categories: ["attributes", "di"]
  modern_drupal_relevant_types: ["code_reference", "bugfix", "refactor", "write_from_spec", "explain_and_implement"]
  modern_drupal_relevant_source_patterns:
    - "/plugin/"
    - ".module"
    - ".install"
    - ".theme"
    - ".services.yml"
  modern_drupal_relevant_instruction_terms:
    - "plugin"
    - "module"
    - "block"
    - "service"
    - "dependency injection"
    - "constructor injection"
    - "containerinterface"
  weak_category_patterns:
    attributes:
      - "#\\[[A-Za-z_\\\\][A-Za-z0-9_\\\\]*"
    di:
      - "\\bContainerInterface\\b"
      - "public\\s+static\\s+function\\s+create\\s*\\("
      - "services\\.yml"
      - "logger\\.factory"
    routing:
      - "routing\\.yml"
      - "\\broute_name\\b"
      - "\\b_controller\\b"
      - "\\bpath:\\s*['\\\"/]"
    sdc:
      - "single\\s+directory\\s+component"
      - "component\\.yml"
      - "\\.component\\.yml"
      - "\\bsdc\\b"
    twig:
      - "\\.twig\\b"
      - "\\{\\{"
      - "\\{%"
      - "component\\.yml"
      - "\\.component\\.yml"
      - "single\\s+directory\\s+component"
  chunk_overlap_lines: 30
  target_test_ratio: 0.45
  exclude_test_sources_from_training_pool: false
  exclude_sources_prefixes:
    - "docs/symfony_com/"
    - "repos/mcp_tools/"
  augmentation:
    enabled: true
    ratio: 1.0
    input_excerpt_lines: 60
    types:
      - "bugfix"
      - "refactor"
      - "write_from_spec"
      - "explain_and_implement"

training:
  test_run:
    max_seq_len: 1024
    padding_strategy: "dynamic"
    pad_to_multiple_of: 8
    max_steps: 300
    per_device_train_batch_size: 1
    per_device_eval_batch_size: 1
    gradient_accumulation_steps: 16
    learning_rate: 0.00001
    logging_steps: 5
    eval_strategy: "steps"
    eval_steps: 100
    save_strategy: "steps"
    save_steps: 100
    warmup_ratio: 0.03
    fp16: false
    bf16: true
    gradient_checkpointing: true
    use_reentrant_gc: false
    group_by_length: false
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
    bnb_4bit_compute_dtype: "float32"
    max_grad_norm: 0.0
    max_models: 1
    models:
      - name: "Ministral-3-3B-Test"
        base_model: "mistralai/Ministral-3-3B-Instruct-2512"
        training_type: "QLoRA"
  full_scale:
    min_train_samples: 5000
    preferred_train_samples: 20000
    require_quality_tooling: true
    max_seq_len: 2048
    padding_strategy: "dynamic"
    pad_to_multiple_of: 8
    num_train_epochs: 3
    max_steps: 450
    per_device_train_batch_size: 2
    per_device_eval_batch_size: 1
    gradient_accumulation_steps: 16 # L40S-safe effective batch for current dataset volume
    learning_rate: 0.0001
    logging_steps: 1
    eval_strategy: "steps"
    eval_steps: 30
    save_strategy: "steps"
    save_steps: 50
    warmup_ratio: 0.1
    fp16: false
    bf16: true
    gradient_checkpointing: true
    use_reentrant_gc: false
    group_by_length: true
    lora_r: 64
    lora_alpha: 128
    lora_dropout: 0.05
    lora_target_modules: ["q_proj", "v_proj", "k_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
    bnb_4bit_compute_dtype: "bfloat16"
    max_models: 1 # Focus on one model for the L40S full_scale session
    models:
      - name: "Qwen2.5-Coder-7B"
        base_model: "Qwen/Qwen2.5-Coder-7B"
        training_type: "QLoRA"

evaluation:
  seed: 42
  mode: "test_run"
  max_new_tokens: 512
  device: "auto"
  max_models: 1
  run_php_lint: true
  run_phpcs: true
  run_phpstan: true
  phpstan_failure_mode: "syntax_only"
  max_code_checks_per_response: 3
  php_snippet_policy: "php_only" # "php_only" (default) or "all_fences" for legacy behavior
  repetition_penalty: 1.1
  no_repeat_ngram_size: 4
  apply_generation_stop_truncation: true
  strict_contract_mode: true
  enforce_no_outside_prose_for_php_required: true
  interim_autofencing:
    enabled: true
    apply_before_contract_checks: true
    preserve_raw_output: true
  checkpoint_sweep:
    enabled: true
    step_interval: 25
    include_adapter: true
  generation_blocklist_strings:
    - "<|fim_prefix|>"
    - "<|fim_middle|>"
    - "<|fim_suffix|>"
    - "<|fim_pad|>"
    - "<fim_prefix>"
    - "<fim_middle>"
    - "<fim_suffix>"
    - "<fim_pad>"
    - "<|file_sep|>"
    - "<|im_start|>"
    - "<|im_end|>"
    - "<|assistant|>"
    - "<|user|>"
    - "### Instruction:"
    - "### Response:"
  generation_stop_regex:
    - "<\\|fim_(prefix|middle|suffix|pad)\\|>"
    - "<fim_(prefix|middle|suffix|pad)>"
    - "<\\|file_sep\\|>"
    - "<\\|im_(start|end)\\|>"
    - "<\\|assistant\\|>"
    - "<\\|user\\|>"
    - "(?m)^\\s*(instruction|input|output|response)\\s*:"
    - "(?m)^\\s*###\\s*(instruction|input|output|response)\\s*:"
  prompt_suite:
    # 40 prompts total: 20 PHP-required and 20 non-PHP-required.
    - id: "block_attribute"
      category: "attributes"
      instruction: "Create a Drupal 11 Block plugin using PHP 8.3 attributes. Return one fenced php block only. Block id must be gym_stats and label Gym Statistics."
      input: ""
      requires_php: true
      require_fenced_php: true
      expected_fenced_blocks: 1
      expected_fenced_languages: ["php"]
      required_substrings: ["#[Block", "gym_stats", "gym statistics"]
    - id: "field_type_attribute"
      category: "attributes"
      instruction: "Create a Drupal 11 FieldType plugin class using attributes for a string-backed field named gym_plan_code. Return one fenced php block."
      input: ""
      requires_php: true
      require_fenced_php: true
      required_substrings: ["#[FieldType", "gym_plan_code", "class"]
    - id: "event_subscriber_attribute"
      category: "attributes"
      instruction: "Write a Drupal 11 event subscriber class that listens to KernelEvents::REQUEST using PHP 8.3 attributes. Return one fenced php block."
      input: ""
      requires_php: true
      require_fenced_php: true
      required_substrings: ["KernelEvents::REQUEST", "eventsubscriber", "class"]
    - id: "access_checker_attribute"
      category: "attributes"
      instruction: "Implement a Drupal 11 custom access checker service class using an attribute-based plugin declaration. Return one fenced php block."
      input: ""
      requires_php: true
      require_fenced_php: true
      required_substrings: ["access", "class", "namespace drupal"]
    - id: "queue_worker_attribute"
      category: "attributes"
      instruction: "Create a Drupal 11 QueueWorker plugin with PHP attribute metadata and processItem(). Return one fenced php block."
      input: ""
      requires_php: true
      require_fenced_php: true
      required_substrings: ["#[QueueWorker", "processItem", "class"]
    - id: "plugin_deriver_attribute"
      category: "attributes"
      instruction: "Create a Drupal 11 plugin deriver class and a matching attribute-based plugin that references the deriver. Return one fenced php block."
      input: ""
      requires_php: true
      require_fenced_php: true
      required_substrings: ["deriver", "class", "#["]
    - id: "command_attribute"
      category: "attributes"
      instruction: "Write a Drupal 11 CLI command class using PHP 8.3 attributes and dependency injection. Return one fenced php block."
      input: ""
      requires_php: true
      require_fenced_php: true
      required_substrings: ["#[", "__construct(", "execute"]
    - id: "action_plugin_attribute"
      category: "attributes"
      instruction: "Implement a Drupal 11 Action plugin using attributes with id gym_publish and label Gym Publish. Return one fenced php block."
      input: ""
      requires_php: true
      require_fenced_php: true
      required_substrings: ["gym_publish", "action", "#["]

    - id: "service_di"
      category: "di"
      instruction: "Define gym.services.yml and a Drupal 11 service class using constructor injection for logger.factory. Return exactly two fenced blocks: yaml first, php second."
      input: ""
      requires_php: true
      require_fenced_php: true
      expected_fenced_blocks: 2
      expected_fenced_languages: ["yaml", "php"]
      required_substrings: ["services:", "logger.factory", "__construct("]
      required_regex: ['```yaml[\s\S]*```[\s\S]*```php']
    - id: "service_factory_di"
      category: "di"
      instruction: "Create a Drupal 11 service class that injects entity_type.manager and builds a node storage helper. Return exactly two fenced blocks: yaml then php."
      input: ""
      requires_php: true
      require_fenced_php: true
      required_substrings: ["entity_type.manager", "services:", "__construct("]
    - id: "plugin_create_di"
      category: "di"
      instruction: "Create a Drupal 11 plugin class implementing ContainerFactoryPluginInterface with create() and constructor injection. Return one fenced php block."
      input: ""
      requires_php: true
      require_fenced_php: true
      required_substrings: ["ContainerFactoryPluginInterface", "create(", "__construct("]
    - id: "subscriber_di_logger"
      category: "di"
      instruction: "Write a Drupal 11 EventSubscriber class that injects logger.channel.default and logs on response. Return one fenced php block."
      input: ""
      requires_php: true
      require_fenced_php: true
      required_substrings: ["EventSubscriberInterface", "__construct(", "logger"]
    - id: "controller_di_time"
      category: "di"
      instruction: "Implement a Drupal 11 controller class that injects datetime.time and returns a render array. Return one fenced php block."
      input: ""
      requires_php: true
      require_fenced_php: true
      required_substrings: ["datetime.time", "__construct(", "render"]
    - id: "cache_service_di"
      category: "di"
      instruction: "Write a Drupal 11 service that injects cache.default and serializes gym stats lookup results. Return one fenced php block."
      input: ""
      requires_php: true
      require_fenced_php: true
      required_substrings: ["cache.default", "__construct(", "class"]
    - id: "services_yaml_alias"
      category: "di"
      instruction: "Provide only Drupal 11 YAML for gym.services.yml defining gym.stats and a public alias gym.stats.alias. Return one fenced yaml block and no php."
      input: ""
      requires_php: false
      required_substrings: ["services:", "gym.stats", "alias"]
    - id: "container_parameters_yaml"
      category: "di"
      instruction: "Provide only Drupal 11 YAML showing service parameters and one service using %gym.default_limit%. Return one fenced yaml block and no php."
      input: ""
      requires_php: false
      required_substrings: ["parameters:", "gym.default_limit", "services:"]

    - id: "routing_yaml"
      category: "routing"
      instruction: "Create gym.routing.yml and a matching Drupal 11 controller for /gym/stats. Return exactly two fenced blocks: yaml first, php second."
      input: ""
      requires_php: true
      require_fenced_php: true
      expected_fenced_blocks: 2
      expected_fenced_languages: ["yaml", "php"]
      required_substrings: ["/gym/stats", "_controller", "class"]
      required_regex: ['```yaml[\s\S]*```[\s\S]*```php']
    - id: "routing_access_service"
      category: "routing"
      instruction: "Create a route using _custom_access and implement the access checker method in a controller/service class. Return exactly two fenced blocks: yaml then php."
      input: ""
      requires_php: true
      require_fenced_php: true
      required_substrings: ["_custom_access", "AccessResult", "class"]
    - id: "routing_admin_form"
      category: "routing"
      instruction: "Create a Drupal 11 admin form route under /admin/config/gym/settings and a form class skeleton. Return exactly two fenced blocks: yaml then php."
      input: ""
      requires_php: true
      require_fenced_php: true
      required_substrings: ["/admin/config/gym/settings", "_form", "ConfigFormBase"]
    - id: "routing_entity_upcast"
      category: "routing"
      instruction: "Define a route with {node} parameter and create a controller method receiving NodeInterface. Return exactly two fenced blocks: yaml then php."
      input: ""
      requires_php: true
      require_fenced_php: true
      required_substrings: ["{node}", "NodeInterface", "_controller"]
    - id: "routing_permission_controller"
      category: "routing"
      instruction: "Define a route for /gym/reports with a custom permission and matching controller method. Return exactly two fenced blocks: yaml then php."
      input: ""
      requires_php: true
      require_fenced_php: true
      required_substrings: ["/gym/reports", "_permission", "class"]
    - id: "routing_json_response"
      category: "routing"
      instruction: "Define a Drupal 11 route and controller returning JsonResponse for /gym/api/stats. Return exactly two fenced blocks: yaml then php."
      input: ""
      requires_php: true
      require_fenced_php: true
      required_substrings: ["/gym/api/stats", "JsonResponse", "_controller"]
    - id: "routing_only_yaml_public"
      category: "routing"
      instruction: "Provide only gym.routing.yml entries for two public read-only routes under /gym/classes and /gym/trainers. Return one fenced yaml block and no php."
